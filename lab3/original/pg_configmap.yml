# Манифест из методички «как было»: DB + USER + PASSWORD лежат в ConfigMap.
# В доработанной версии креды вынесены в Secret (../pg_secret.yml),
# здесь остаётся только POSTGRES_DB (../pg_configmap.yml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-configmap
  labels:
    app: postgres
data:
  POSTGRES_DB: "nextcloud"
  POSTGRES_USER: "nc_dbuser"
  POSTGRES_PASSWORD: "PgLab3-2026"
